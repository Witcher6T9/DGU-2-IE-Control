name: Security & Vulnerability Scan

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    # Run weekly on Sundays at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency Audit & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run NPM Audit
        run: |
          npm audit --audit-level=moderate || {
            echo "NPM audit flagged vulnerabilities - please review high/critical dependencies."
          }

      - name: Secret Scan Verification
        run: |
          echo "Scanning for accidental hardcoded secrets in codebase..."
          # Verify .env files are not tracked in git
          if git ls-files | grep -E '^\.env(\.local)?$'; then
            echo "ERROR: Tracked .env file found in git!"
            exit 1
          fi
          echo "✓ No tracked secret environment files detected."
