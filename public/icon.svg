<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b7e88"/>
      <stop offset="50%" stop-color="#145b63"/>
      <stop offset="100%" stop-color="#0b383d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Accent -->
  <path d="M64 160h384M64 256h384M64 352h384M160 64v384M256 64v384M352 64v384" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  
  <!-- Central Emblem with Shadow -->
  <g filter="url(#shadow)">
    <!-- Factory Sewing / Efficiency Line Silhouette -->
    <!-- Production Flow Arrow / Line Balance Wave -->
    <path d="M120 330 C 180 330, 200 210, 260 210 C 320 210, 330 280, 392 280" fill="none" stroke="url(#glowGrad)" stroke-width="20" stroke-linecap="round"/>
    
    <!-- Balance Bars / Stations -->
    <rect x="140" y="240" width="24" height="90" rx="10" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="195" y="190" width="24" height="140" rx="10" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="250" y="160" width="24" height="170" rx="10" fill="url(#goldGrad)"/>
    <rect x="305" y="210" width="24" height="120" rx="10" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="360" y="260" width="24" height="70" rx="10" fill="#ffffff" fill-opacity="0.95"/>
    
    <!-- Takt Pulse Node -->
    <circle cx="262" cy="140" r="16" fill="#fbbf24"/>
    <circle cx="262" cy="140" r="28" fill="none" stroke="#fbbf24" stroke-width="4" stroke-opacity="0.4"/>
    
    <!-- Precision Gauge / Stop-watch Arc -->
    <path d="M170 140 A 130 130 0 0 1 342 140" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="6" stroke-dasharray="8 8"/>
  </g>
  
  <!-- Top Branding Accent (IE Badging) -->
  <rect x="186" y="380" width="140" height="34" rx="17" fill="rgba(0,0,0,0.3)"/>
  <text x="256" y="403" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="3">IE CONTROL</text>
</svg>
